[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ln-gossip-benchmark"
version = "0.1.0"
description = "Predicting channel closures in the Lightning Network from gossip data"
readme = "README.md"
requires-python = ">=3.9,<3.11"
license = { file = "LICENSE" }
authors = [{ name = "Simone Antonelli" }]
dependencies = [
    "gitpython>=3.1",
    "huggingface-hub>=0.24",
    "hydra-core>=1.3",
    "lightgbm>=4.0",
    "numpy<2.0.0",
    "omegaconf>=2.3",
    "pandas<2.0.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "torch==2.5.1",
    "torch-geometric>=2.6.1",
    "tqdm>=4.66",
    "wandb>=0.16",
    "xgboost>=2.0",
]

[project.optional-dependencies]
shap = ["shap>=0.49"]

[tool.setuptools]
include-package-data = true
zip-safe = false
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pyflakes>=3.4.0",
    "ruff>=0.15.12",
]
