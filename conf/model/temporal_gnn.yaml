# Temporal Graph Network (TGN) — paper headline TGN config.
# GraphSAGE/TransformerConv message passing with a linear head on top of
# the GNN embeddings (mlp_num_hidden_layers=0).
defaults:
  - _base
  - _training

name: temporal_gnn

hidden_dim: 128
num_layers: 1
time_dim: 128
mlp_hidden_dim: 128
mlp_num_hidden_layers: 0
use_node_history: true
use_edge_features: true
use_time_encoding: true
use_gnn_embeddings: true

# Pairs of edge-feature indices that swap when the edge direction is
# reversed for bidirectional message passing (e.g. src_fee ↔ dst_fee).
directional_feature_pairs:
  - [0, 1]   # src_disabled <-> dst_disabled
  - [3, 4]   # src_fee_rate_milli_msat <-> dst_fee_rate_milli_msat
  - [5, 6]   # src_fee_base_msat <-> dst_fee_base_msat
  - [7, 8]   # src_min_htlc <-> dst_min_htlc
  - [9, 10]  # src_time_lock_delta <-> dst_time_lock_delta

predictor:
  _target_: ln_gossip_benchmark.modules.GNNPredictor
  hidden_dim: ${model.hidden_dim}
  num_layers: ${model.num_layers}
  time_dim: ${model.time_dim}
  mlp_hidden_dim: ${model.mlp_hidden_dim}
  mlp_num_hidden_layers: ${model.mlp_num_hidden_layers}
  use_node_history: ${model.use_node_history}
  use_edge_features: ${model.use_edge_features}
  use_time_encoding: ${model.use_time_encoding}
  use_gnn_embeddings: ${model.use_gnn_embeddings}
  directional_feature_pairs: ${model.directional_feature_pairs}
